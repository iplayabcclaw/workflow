<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H3 视频工作流</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/preview.css"></head>
<body><main><header><div><p class="eyebrow">AUTODL · MINIMAX H3</p><h1>图片 / 音频生成视频</h1><p>提交后自动轮询状态；成功资源会立即下载到本机。</p></div><span id="connection" class="badge">检查配置中…</span></header>
<nav class="app-tabs" aria-label="页面导航"><button class="app-tab active" type="button" data-view="generation">生成视频</button><button class="app-tab" type="button" data-view="history">历史记录</button></nav>
<section id="generationView" class="workbench"><div class="panel"><div class="tabs" role="tablist"><button class="tab active" type="button" role="tab" data-workflow="image_audio">图生视频</button><button class="tab" type="button" role="tab" data-workflow="text">文生视频</button></div><form id="form"><input id="workflowType" name="workflow_type" type="hidden" value="image_audio"><label>视频提示词<textarea name="prompt" required placeholder="描述人物、动作、镜头和声音…"></textarea></label><div id="referenceFields" class="grid"><label>参考图片（可选）<input name="image" type="file" accept="image/*"></label><label>参考音频（可选，可多选）<input name="audio" type="file" accept="audio/*" multiple></label></div><div class="grid"><label>时长（秒）<input id="duration" name="duration" type="number" min="1" max="15" value="15" required></label><label>画幅<select id="resolution" name="resolution"><option>768p竖</option><option>768p横</option></select></label><label id="seedField">随机种子（1–999999999999999，可留空）<input name="seed" inputmode="numeric" min="1" max="999999999999999" placeholder="自动随机"></label></div><button id="submit" type="submit">生成视频</button><p id="notice" role="status"></p></form></div><aside class="request-preview"><div><p class="eyebrow">REQUEST PREVIEW</p><h2>实际请求参数</h2></div><p id="previewHint" class="muted">随填写内容实时更新；点击生成时按此 JSON 发送。</p><pre id="payloadPreview">{}</pre></aside></section>
<section id="historyView" hidden><div class="section-title"><h2>任务记录</h2><button class="secondary" id="reload">刷新</button></div><div id="tasks" class="tasks"><p class="muted">暂无任务</p></div></section></main><script src="/app.js"></script></body></html>
